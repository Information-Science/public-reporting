<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Burndown — OI-3182 · DNF Automated Patching Strategy (Epic)</title>
<style>
body{margin:0;padding:2rem;font-family:sans-serif;background:#f5f5f5}
.card{background:#fff;border:0.5px solid #D3D1C7;border-radius:12px;padding:1.25rem;max-width:900px;margin:0 auto}
h1{font-size:15px;font-weight:500;color:#2C2C2A;margin:0 0 1rem}
.metrics{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.m{background:#F1EFE8;border-radius:8px;padding:1rem;flex:1;min-width:100px}
.ml{font-size:13px;color:#5F5E5A;margin-bottom:4px}
.mv{font-size:24px;font-weight:500}
.legend{display:flex;gap:16px;margin-bottom:12px;font-size:12px;color:#5F5E5A;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.cw{position:relative;width:100%;height:300px}
.meta{font-size:12px;color:#888780;margin:14px 0 0}
.meta span{margin-right:1.5em}
.ts{font-size:11px;color:#B4B2A9;text-align:right;margin:6px 0 0}
</style>
</head>
<body>
<div class="card">
  <h1>OI-3182 · DNF Automated Patching Strategy (Epic)</h1>
  <div class="metrics">
    <div class="m"><div class="ml">total issues</div><div class="mv" style="color:#2C2C2A">24</div></div>
    <div class="m"><div class="ml">done</div><div class="mv" style="color:#3B6D11">5</div></div>
    <div class="m"><div class="ml">remaining</div><div class="mv" style="color:#D85A30">19</div></div>
    <div class="m"><div class="ml">in progress</div><div class="mv" style="color:#BA7517">2</div></div>
  </div>
  <div class="legend">
    <span><span class="sw" style="background:#D85A30"></span>remaining</span>
    
    <span><span class='sw' style='background:#639922'></span>projected</span>
  </div>
  <div class="cw">
    <canvas id="c" role="img" aria-label="Burndown chart for OI-3182. 19 of 24 issues remaining.">
      Burndown: 19 of 24 issues remaining as of 01 Jun 2026.
    </canvas>
  </div>
  <p class="meta">
    <span>Start date: 01 Jun 2026</span>
    <span>·</span>
    <span>Velocity: 3.57 issues/week</span>
    <span>·</span>
    <span>Projected completion: ~16 Jul 2026</span>
  </p>
  <p class="ts">Generated 9 Jun 2026 16:51</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
new Chart(document.getElementById("c"),{
  type:"line",
  data:{
    labels:["1 Jun","2 Jun","3 Jun","4 Jun","5 Jun","6 Jun","7 Jun","8 Jun","9 Jun","16 Jun","23 Jun","30 Jun","7 Jul","14 Jul","16 Jul"],
    datasets:[
      {label:"Remaining",data:[24,21,21,21,19,19,19,19,19,null,null,null,null,null,null],borderColor:"#D85A30",
       backgroundColor:"rgba(216,90,48,0.06)",borderWidth:2.5,
       pointRadius:4,pointBackgroundColor:"#D85A30",fill:false,spanGaps:false,tension:0.1},
      {label:"Projected",data:[null,null,null,null,null,null,null,null,19,15.43,11.86,8.29,4.71,1.14,0.0],borderColor:"#639922",
       borderWidth:1.5,borderDash:[8,4],pointRadius:0,fill:false,spanGaps:true,tension:0.1}
    ]
  },
  options:{
    responsive:true,maintainAspectRatio:false,
    interaction:{mode:"index",intersect:false},
    plugins:{
      legend:{display:false},
      tooltip:{backgroundColor:"#fff",titleColor:"#2C2C2A",bodyColor:"#5F5E5A",
               borderColor:"#D3D1C7",borderWidth:0.5,padding:10,
               filter:item=>item.parsed.y!==null,
               callbacks:{label:ctx=>ctx.dataset.label+": "+Math.round(ctx.parsed.y)}}
    },
    scales:{
      x:{grid:{color:"rgba(0,0,0,0.05)"},ticks:{color:"#888780",font:{size:11},maxRotation:45,autoSkip:true,maxTicksLimit:9}},
      y:{min:0,grid:{color:"rgba(0,0,0,0.05)"},
         ticks:{color:"#888780",font:{size:11},callback:v=>Math.round(v)},
         title:{display:true,text:"issues",color:"#888780",font:{size:11}}}
    }
  }
});
</script>
</body>
</html>
